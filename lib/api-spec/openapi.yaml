openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Reviewed AlKabir Islamic Challenge API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quiz
  - name: progress
  - name: admin
  - name: daily
    description: UTC daily challenge progress
  - name: auth
    description: Authentication and explicit guest-progress linking
  - name: profile
    description: Authenticated member profile onboarding
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /livez:
    get:
      operationId: liveHealth
      tags: [health]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /readyz:
    get:
      operationId: readyHealth
      tags: [health]
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /me/feedback:
    get:
      operationId: listMyFeedback
      tags: [profile]
      responses:
        "200":
          description: Feedback submitted by the member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMyFeedback
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/beta/feedback:
    get:
      operationId: listBetaFeedback
      tags: [admin]
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/FeedbackStatus" }
        - in: query
          name: kind
          schema: { $ref: "#/components/schemas/FeedbackKind" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Feedback queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackList" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/beta/feedback/{feedbackId}:
    patch:
      operationId: moderateBetaFeedback
      tags: [admin]
      parameters:
        - in: path
          name: feedbackId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackModerationInput" }
      responses:
        "200":
          description: Moderated feedback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/beta/summary:
    get:
      operationId: getBetaSummary
      tags: [admin]
      responses:
        "200":
          description: Aggregate beta summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaSummary" }
  /admin/beta/audit:
    get:
      operationId: listBetaAudit
      tags: [admin]
      parameters:
        - in: query
          name: action
          schema: { type: string, maxLength: 100 }
        - in: query
          name: entityType
          schema: { type: string, maxLength: 100 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Safe operator audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /quiz/config:
    get:
      operationId: getQuizConfig
      tags: [quiz]
      summary: Get active quiz configuration
      responses:
        "200":
          description: Active taxonomies and daily challenge metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizConfig"
  /quiz/daily:
    get:
      operationId: getDailyQuiz
      tags: [quiz]
      summary: Resolve the active UTC daily challenge
      responses:
        "200":
          description: Active daily challenge metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyQuiz" }
        "404":
          description: No active challenge is scheduled for the current UTC date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /quiz/attempts:
    post:
      operationId: startQuizAttempt
      tags: [quiz]
      summary: Start or resume a quiz attempt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAttemptRequest"
      responses:
        "201":
          description: Attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptState"
        "400":
          $ref: "#/components/responses/BadRequest"
  /quiz/attempts/{attemptId}:
    get:
      operationId: getQuizAttempt
      tags: [quiz]
      summary: Resume an owned quiz attempt
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Resumable attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptState"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /quiz/attempts/{attemptId}/answers:
    post:
      operationId: answerQuizQuestion
      tags: [quiz]
      summary: Submit one answer and score it on the server
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Scored answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /quiz/attempts/{attemptId}/complete:
    post:
      operationId: completeQuizAttempt
      tags: [quiz]
      summary: Complete an attempt idempotently
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Final result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /quiz/results/{attemptId}:
    get:
      operationId: getQuizResult
      tags: [quiz]
      summary: Get the final result for an owned attempt
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/quiz/history:
    get:
      operationId: getQuizHistory
      tags: [progress]
      summary: Get authenticated quiz history
      responses:
        "200":
          description: Completed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/quiz/progress:
    get:
      operationId: getQuizProgress
      tags: [progress]
      summary: Get authenticated points and streak progress
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/quiz/questions:
    get:
      operationId: listAdminQuestions
      tags: [admin]
      summary: List question bank and review queue records
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QuestionStatus"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Question records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAdminQuestion
      tags: [admin]
      summary: Create a draft question version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionWriteRequest"
      responses:
        "201":
          description: Draft question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/quiz/questions/export-csv:
    get:
      operationId: exportAdminQuestionsCsv
      tags: [admin]
      summary: Export selected or filtered question records as an importer-ready CSV
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QuestionStatus"
        - in: query
          name: question_id
          description: Export only these selected question IDs when provided.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: Question import CSV
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/quiz/questions/{questionId}:
    patch:
      operationId: updateAdminQuestion
      tags: [admin]
      summary: Create a new immutable question version
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionWriteRequest"
      responses:
        "200":
          description: New draft version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/quiz/questions/import-csv:
    post:
      operationId: importAdminQuestionsCsv
      tags: [admin]
      summary: Create or update draft questions from a validated CSV file
      description: All-or-nothing import. Blank question_id and expected_version fields create a question; populated fields update the referenced question only when its current version matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCsvImportRequest"
      responses:
        "201":
          description: Draft questions created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCsvImportResponse"
        "400":
          description: CSV or row validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCsvImportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/quiz/questions/{questionId}/reviews:
    post:
      operationId: reviewQuestion
      tags: [admin]
      summary: Apply an audited review transition
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Reviewed question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/quiz/generation-runs:
    post:
      operationId: createGenerationRun
      tags: [admin]
      summary: Record a bounded AI generation run as pending review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationRunRequest"
      responses:
        "201":
          description: Pending review generation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRun"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/quiz/analytics:
    get:
      operationId: getQuizAnalytics
      tags: [admin]
      summary: Get aggregate quiz analytics
      responses:
        "200":
          description: Aggregate counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAnalytics"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/quiz/quizzes:
    get:
      operationId: listAdminQuizzes
      tags: [admin]
      summary: List scheduled quizzes and question summaries
      responses:
        "200":
          description: Scheduled quiz records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuizList"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminQuiz
      tags: [admin]
      summary: Schedule a quiz from approved current question versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizScheduleRequest"
      responses:
        "201":
          description: Scheduled quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuiz"
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/quiz/quizzes/{quizId}:
    patch:
      operationId: updateAdminQuiz
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/QuizId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizScheduleRequest"
      responses:
        "200":
          description: Updated scheduled quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuiz"
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/quiz/quizzes/{quizId}/preview:
    get:
      operationId: previewAdminQuiz
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/QuizId"
      responses:
        "200":
          description: Exact public payload without answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuizPreview"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List internal users and assigned access roles
      responses:
        "200":
          description: Internal user access records without personal profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/permission-templates:
    get:
      operationId: listPermissionTemplates
      tags: [admin]
      responses:
        "200":
          description: Reusable permission templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionTemplateList" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPermissionTemplate
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionTemplateInput" }
      responses:
        "201":
          description: Created permission template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionTemplate" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/permission-templates/{templateId}:
    patch:
      operationId: updatePermissionTemplate
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionTemplateInput" }
      responses:
        "200":
          description: Updated permission template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionTemplate" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deletePermissionTemplate
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{userId}/permission-template:
    put:
      operationId: assignPermissionTemplate
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionTemplateAssignment" }
      responses:
        "200":
          description: Updated user access record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: clearPermissionTemplate
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Updated user access record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{userId}/permission-overrides:
    put:
      operationId: setPermissionOverride
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionOverrideInput" }
      responses:
        "200":
          description: Updated user access record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{userId}/permission-overrides/{permission}:
    delete:
      operationId: clearPermissionOverride
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - in: path
          name: permission
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated user access record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{userId}/roles:
    post:
      operationId: grantAdminUserRole
      tags: [admin]
      summary: Grant a reviewer or administrator role
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
      responses:
        "200":
          description: Updated access record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: revokeAdminUserRole
      tags: [admin]
      summary: Revoke a reviewer or administrator role
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
      responses:
        "200":
          description: Updated access record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current account and guest-progress state
      responses:
        "200":
          description: Current optional-user state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
  /auth/link-guest-progress:
    post:
      operationId: linkGuestProgress
      tags: [auth]
      summary: Explicitly link the current anonymous progress to the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGuestProgressRequest"
      responses:
        "200":
          description: Guest progress was linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGuestProgressResult"
        "400":
          description: Explicit confirmation is missing
        "401":
          description: Authentication is required
        "403":
          description: Origin or CSRF validation failed
        "410":
          description: Anonymous session expired
  /me/profile:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get the authenticated member profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateMyProfile
      tags: [profile]
      summary: Create or update the authenticated member profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchMyProfile
      tags: [profile]
      summary: Partially update the authenticated member profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      in: path
      name: questionId
      required: true
      schema:
        type: string
        format: uuid
    QuizId:
      in: path
      name: quizId
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
        description: Opaque user management UUID.
    TemplateId:
      in: path
      name: templateId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HealthStatus:
      type: object
      required: [status, guestSessionCleanup]
      properties:
        status:
          type: string
        guestSessionCleanup:
          $ref: "#/components/schemas/GuestSessionCleanupHealth"
    GuestSessionCleanupHealth:
      type: object
      required:
        - status
        - lastAttemptAt
        - lastSuccessAt
        - lastFailureAt
        - consecutiveFailures
        - sessionsScanned
        - attemptsDeleted
        - sessionsDeleted
        - expiredSessionsRemaining
        - abandonedAttemptsRemaining
      properties:
        status:
          type: string
          enum: [unknown, healthy, backlog, failed]
        lastAttemptAt:
          type: [string, "null"]
        lastSuccessAt:
          type: [string, "null"]
        lastFailureAt:
          type: [string, "null"]
        consecutiveFailures:
          type: integer
          minimum: 0
        sessionsScanned:
          type: integer
          minimum: 0
        attemptsDeleted:
          type: integer
          minimum: 0
        sessionsDeleted:
          type: integer
          minimum: 0
        expiredSessionsRemaining:
          type: integer
          minimum: 0
        abandonedAttemptsRemaining:
          type: integer
          minimum: 0
    FeedbackKind:
      type: string
      enum: [question_accuracy, technical, accessibility, general]
    FeedbackStatus:
      type: string
      enum: [open, in_review, resolved, dismissed]
    FeedbackInput:
      type: object
      required: [kind, message]
      properties:
        kind: { $ref: "#/components/schemas/FeedbackKind" }
        message: { type: string, minLength: 1, maxLength: 5000 }
        questionId: { type: string, format: uuid }
        questionVersionId: { type: string, format: uuid }
    FeedbackModerationInput:
      type: object
      required: [status, expectedStatus]
      properties:
        status: { $ref: "#/components/schemas/FeedbackStatus" }
        expectedStatus: { $ref: "#/components/schemas/FeedbackStatus" }
        resolutionNote: { type: string, maxLength: 2000, nullable: true }
    Feedback:
      type: object
      required: [id, kind, message, status, questionId, questionVersionId, resolutionNote, resolvedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/FeedbackKind" }
        message: { type: string }
        status: { $ref: "#/components/schemas/FeedbackStatus" }
        questionId: { type: string, format: uuid, nullable: true }
        questionVersionId: { type: string, format: uuid, nullable: true }
        resolutionNote: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Feedback" }
        total: { type: integer, minimum: 0 }
    BetaSummarySeries:
      type: object
      required: [date, signups, completions, uniqueCompleters]
      properties:
        date: { $ref: "#/components/schemas/CanonicalDailyDate" }
        signups: { type: integer, minimum: 0 }
        completions: { type: integer, minimum: 0 }
        uniqueCompleters: { type: integer, minimum: 0 }
    BetaSummary:
      type: object
      required: [totalMembers, completedProfiles, activeMembers7d, uniqueCompleters7d, quizCompletions7d, openFeedback, pendingReviewQuestions, approvedQuestions, scheduledActiveDaysAhead, series]
      properties:
        totalMembers: { type: integer, minimum: 0 }
        completedProfiles: { type: integer, minimum: 0 }
        activeMembers7d: { type: integer, minimum: 0 }
        uniqueCompleters7d: { type: integer, minimum: 0 }
        quizCompletions7d: { type: integer, minimum: 0 }
        openFeedback: { type: integer, minimum: 0 }
        pendingReviewQuestions: { type: integer, minimum: 0 }
        approvedQuestions: { type: integer, minimum: 0 }
        scheduledActiveDaysAhead: { type: integer, minimum: 0 }
        series:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/BetaSummarySeries" }
    AuditEvent:
      type: object
      required: [id, actorId, action, entityType, entityId, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, maxLength: 256 }
        action: { type: string, maxLength: 100 }
        entityType: { type: string, maxLength: 100 }
        entityId: { type: string, maxLength: 256 }
        metadata:
          type: object
          additionalProperties:
            oneOf: [{ type: string }, { type: number }, { type: boolean }, { type: "null" }]
        createdAt: { type: string, format: date-time }
    AuditList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer, minimum: 0 }
    QuestionStatus:
      type: string
      enum: [draft, pending_review, approved, rejected, archived]
    Taxonomy:
      type: object
      required: [id, kind, slug, label]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        slug:
          type: string
        label:
          type: string
    PublicChoice:
      type: object
      required: [id, label, position]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        position:
          type: integer
    PublicQuestion:
      type: object
      required: [id, versionId, prompt, type, points, choices]
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        prompt:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false]
        points:
          type: integer
        choices:
          type: array
          items:
            $ref: "#/components/schemas/PublicChoice"
    QuizConfig:
      type: object
      required: [featureName, dailyTimezone, categories, audiences, difficulties]
      properties:
        featureName:
          type: string
        dailyTimezone:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Taxonomy"
        audiences:
          type: array
          items:
            $ref: "#/components/schemas/Taxonomy"
        difficulties:
          type: array
          items:
            $ref: "#/components/schemas/Taxonomy"
    DailyQuiz:
      type: object
      required: [quizId, title, scheduledDate, questionCount]
      properties:
        quizId: { type: string, format: uuid }
        title: { type: string }
        scheduledDate: { $ref: "#/components/schemas/CanonicalDailyDate" }
        questionCount: { type: integer, minimum: 0 }
    StartAttemptRequest:
      type: object
      required: [quizId, idempotencyKey]
      properties:
        quizId:
          type: string
          format: uuid
        audienceId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    AttemptState:
      type: object
      required: [attemptId, quizId, challengeDate, status, questions, answeredQuestionIds]
      properties:
        attemptId:
          type: string
          format: uuid
        quizId:
          type: string
          format: uuid
        challengeDate:
          $ref: "#/components/schemas/CanonicalDailyDate"
        status:
          type: string
          enum: [in_progress, completed]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/PublicQuestion"
        answeredQuestionIds:
          type: array
          items:
            type: string
            format: uuid
    SubmitAnswerRequest:
      type: object
      required: [versionId, choiceId, idempotencyKey]
      properties:
        versionId:
          type: string
          format: uuid
        choiceId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
        responseTimeMs:
          type: integer
          minimum: 0
    AnswerResult:
      type: object
      required: [versionId, choiceId, isCorrect, awardedPoints, explanation, sources]
      properties:
        versionId:
          type: string
          format: uuid
        choiceId:
          type: string
          format: uuid
        isCorrect:
          type: boolean
        awardedPoints:
          type: integer
        explanation:
          type: string
        sources:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
              url:
                type: string
                format: uri
    QuizResult:
      type: object
      required: [attemptId, challengeDate, status, score, maxScore, answers]
      properties:
        attemptId:
          type: string
          format: uuid
        challengeDate:
          $ref: "#/components/schemas/CanonicalDailyDate"
        status:
          type: string
          enum: [in_progress, completed]
        score:
          type: integer
        maxScore:
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerResult"
        rewardPoints:
          type: integer
    QuizHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
    QuizProgress:
      type: object
      required: [points, currentStreak]
      properties:
        points:
          type: integer
        currentStreak:
          type: integer
        lastQualifyingDate:
          type: string
          format: date
    QuestionChoiceInput:
      type: object
      required: [label, position, isCorrect]
      properties:
        label:
          type: string
        position:
          type: integer
        isCorrect:
          type: boolean
    QuestionWriteRequest:
      type: object
      required: [prompt, explanation, choices, sourceMetadata]
      properties:
        categoryId:
          type: string
          format: uuid
        difficultyId:
          type: string
          format: uuid
        audienceIds:
          type: array
          items:
            type: string
            format: uuid
        prompt:
          type: string
        explanation:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false]
        points:
          type: integer
          minimum: 1
        choices:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/QuestionChoiceInput"
        sourceMetadata:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
              url:
                type: string
                format: uri
    QuestionCsvImportRequest:
      type: object
      required: [filename, csv]
      properties:
        filename:
          type: string
          minLength: 1
        csv:
          type: string
          description: Raw UTF-8 CSV text. The server enforces a 2 MiB limit.
    QuestionCsvImportResponse:
      type: object
      required: [importedCount, createdCount, updatedCount, questionIds]
      properties:
        importedCount:
          type: integer
          minimum: 1
        createdCount:
          type: integer
          minimum: 0
        updatedCount:
          type: integer
          minimum: 0
        questionIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    QuestionCsvImportRowError:
      type: object
      required: [row, column, message]
      properties:
        row:
          type: integer
          minimum: 0
        column:
          type: string
        message:
          type: string
    QuestionCsvImportError:
      type: object
      required: [error, rowErrors]
      properties:
        error:
          type: string
        rowErrors:
          type: array
          items:
            $ref: "#/components/schemas/QuestionCsvImportRowError"
    AdminQuestion:
      type: object
      required: [id, status, categoryId, difficultyId, audienceIds, versionId, version, prompt, explanation, type, points, choices, sourceMetadata]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/QuestionStatus"
        categoryId:
          type: string
          format: uuid
          nullable: true
        difficultyId:
          type: string
          format: uuid
          nullable: true
        audienceIds:
          type: array
          items:
            type: string
            format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: integer
        prompt:
          type: string
        explanation:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false]
        points:
          type: integer
          minimum: 1
        choices:
          type: array
          items:
            $ref: "#/components/schemas/QuestionChoiceInput"
        sourceMetadata:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
              url:
                type: string
                format: uri
    AdminQuestionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestion"
        total:
          type: integer
    ReviewRequest:
      type: object
      required: [decision, expectedStatus]
      properties:
        decision:
          type: string
          enum: [submit, approve, reject, archive]
        expectedStatus:
          $ref: "#/components/schemas/QuestionStatus"
        note:
          type: string
    GenerationRunRequest:
      type: object
      required: [provider, model, promptVersion, questions]
      properties:
        provider:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        questions:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/QuestionWriteRequest"
    GenerationRun:
      type: object
      required: [id, provider, model, promptVersion, outputCount, status]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        outputCount:
          type: integer
        status:
          type: string
          enum: [pending_review]
    QuizAnalytics:
      type: object
      required: [questionCounts, attemptCounts]
      properties:
        questionCounts:
          type: object
          additionalProperties:
            type: integer
        attemptCounts:
          type: object
          additionalProperties:
            type: integer
    QuizQuestionMembership:
      type: object
      required: [versionId, points]
      properties:
        versionId: { type: string, format: uuid }
        points: { type: integer, minimum: 1 }
    QuizScheduleRequest:
      type: object
      required: [title, scheduledDate, timezone, isActive, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        scheduledDate:
          $ref: "#/components/schemas/CanonicalDailyDate"
        timezone: { type: string, enum: [UTC] }
        isActive: { type: boolean }
        questions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/QuizQuestionMembership" }
    AdminQuiz:
      type: object
      required: [id, slug, title, scheduledDate, timezone, isActive, questionCount, questions]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        scheduledDate: { $ref: "#/components/schemas/CanonicalDailyDate" }
        timezone: { type: string }
        isActive: { type: boolean }
        questionCount: { type: integer }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuizQuestionMembership" }
    AdminQuizList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminQuiz" }
    AdminQuizPreview:
      type: object
      required: [id, title, scheduledDate, timezone, isActive, questions]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        scheduledDate: { $ref: "#/components/schemas/CanonicalDailyDate" }
        timezone: { type: string }
        isActive: { type: boolean }
        questions:
          type: array
          items: { $ref: "#/components/schemas/PublicQuestion" }
    CanonicalDailyDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Date-only UTC calendar date used for challenge selection, completion, streaks, and rewards.
      example: "2026-09-11"
    DailyAttempt:
      type: object
      properties:
        id:
          type: string
        challengeId:
          type: string
        challengeDate:
          $ref: "#/components/schemas/CanonicalDailyDate"
        issuedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, challengeId, challengeDate, issuedAt]
    DailyReward:
      type: object
      properties:
        id:
          type: string
        challengeDate:
          $ref: "#/components/schemas/CanonicalDailyDate"
        points:
          type: integer
      required: [id, challengeDate, points]
    DailyCompletion:
      type: object
      properties:
        id:
          type: string
        attemptId:
          type: string
        challengeDate:
          $ref: "#/components/schemas/CanonicalDailyDate"
        completedAt:
          type: string
          format: date-time
        streak:
          type: integer
        reward:
          $ref: "#/components/schemas/DailyReward"
      required: [id, attemptId, challengeDate, completedAt, streak, reward]
    AuthMe:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        guestProgress:
          $ref: "#/components/schemas/GuestProgress"
        profileComplete:
          type: boolean
        onboardingRequired:
          type: boolean
      required: [authenticated, user, guestProgress, profileComplete, onboardingRequired]
    AuthUser:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[^\s]+$'
        roles:
          type: array
          items:
            type: string
            enum: [reviewer, admin]
        isSuperAdmin: { type: boolean }
        permissions:
          type: array
          items: { type: string }
      required: [id, roles, isSuperAdmin, permissions]
    ManagedRole:
      type: string
      enum: [reviewer, admin]
    RoleChangeRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ManagedRole"
    AdminUser:
      type: object
      required: [id, createdAt, roles, isSuperAdmin, permissions, template, overrides]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque management UUID; never a Clerk subject or internal users.id.
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ManagedRole"
        isSuperAdmin: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        template:
          oneOf:
            - $ref: "#/components/schemas/PermissionTemplateAssignmentInfo"
            - type: "null"
        overrides:
          type: array
          items: { $ref: "#/components/schemas/PermissionOverride" }
    AdminUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
    PermissionTemplateInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    PermissionTemplate:
      type: object
      required: [id, name, description, permissions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PermissionTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PermissionTemplate" }
    PermissionTemplateAssignment:
      type: object
      required: [templateId]
      properties:
        templateId: { type: string, format: uuid }
    PermissionTemplateAssignmentInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PermissionOverrideInput:
      type: object
      required: [permission, effect]
      properties:
        permission: { type: string }
        effect: { type: string, enum: [allow, deny] }
    PermissionOverride:
      type: object
      required: [permission, effect]
      properties:
        permission: { type: string }
        effect: { type: string, enum: [allow, deny] }
    GuestProgress:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        hasUnlinkedProgress:
          type: boolean
      required: [count, hasUnlinkedProgress]
    LinkGuestProgressRequest:
      type: object
      properties:
        confirm:
          type: boolean
      required: [confirm]
    LinkGuestProgressResult:
      type: object
      properties:
        linked:
          type: boolean
        linkedAttemptCount:
          type: integer
          minimum: 0
      required: [linked, linkedAttemptCount]
    MemberProfile:
      type: object
      required: [firstName, lastName, email, country, city, state, announcementConsent, consentAt, consentVersion, profileCompletedAt, profileComplete]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        city: { type: string }
        state: { type: string, nullable: true }
        announcementConsent: { type: boolean }
        consentAt: { type: string, format: date-time, nullable: true }
        consentVersion: { type: string, nullable: true }
        profileCompletedAt: { type: string, format: date-time, nullable: true }
        profileComplete: { type: boolean }
    MemberProfileUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        country: { type: string, minLength: 2, maxLength: 2 }
        city: { type: string, minLength: 1, maxLength: 120 }
        state: { type: string, maxLength: 100, nullable: true }
        announcementConsent: { type: boolean }